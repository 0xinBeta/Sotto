<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title data-i18n="extensionName"></title>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow" data-i18n="panelEyebrow"></p>
          <div class="wordmark">
            <svg
              class="brand-mark"
              viewBox="0 0 128 128"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="4" y="4" width="120" height="120" rx="28" fill="#111311" />
              <g fill="var(--acid)">
                <rect x="27" y="28" width="16" height="72" rx="8" />
                <rect x="49" y="36" width="16" height="56" rx="8" />
                <rect x="71" y="44" width="16" height="40" rx="8" />
                <rect x="93" y="52" width="12" height="24" rx="6" />
              </g>
            </svg>
            <h1 data-i18n-prepend="extensionName"><span aria-hidden="true">.</span></h1>
          </div>
        </div>
        <div class="masthead-actions">
          <div
            class="status-chip"
            id="status-chip"
            data-state="booting"
            role="status"
            aria-atomic="true"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-label" data-i18n="statusCheckingHardware"></span>
          </div>
          <label
            class="quiet-switch"
            id="quiet-mode-control"
            for="quiet-mode"
            data-state="off"
          >
            <svg
              class="quiet-icon"
              viewBox="0 0 20 20"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M3 8h3l4-3v10l-4-3H3z" />
              <path d="M13 7c1.5 1.5 1.5 4.5 0 6" />
              <path class="quiet-icon-slash" d="M4 4l12 12" />
            </svg>
            <span id="quiet-mode-label" data-i18n="quietModeOff"></span>
            <input
              id="quiet-mode"
              type="checkbox"
              role="switch"
              aria-labelledby="quiet-mode-label"
            />
            <span class="quiet-switch-track" aria-hidden="true"></span>
          </label>
        </div>
      </header>
      <p class="sr-only" id="pipeline-error" role="alert" aria-atomic="true"></p>

      <section
        class="setup-view"
        id="setup-view"
        data-state="expanded"
        aria-labelledby="setup-heading"
      >
        <div class="setup-heading">
          <div>
            <p class="section-index" data-i18n="setupIndex"></p>
            <h2 id="setup-heading" data-i18n="setupHeading"></h2>
          </div>
          <span class="setup-count" data-i18n="setupStepCount"></span>
        </div>
        <ol class="setup-list" id="setup-list">
          <li class="setup-row" id="setup-microphone" data-state="pending">
            <span class="setup-icon" id="setup-microphone-icon" aria-hidden="true">…</span>
            <p>
              <strong data-i18n="microphone"></strong>
              <span
                id="setup-microphone-state"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                data-i18n="setupPendingCheckingAccess"
              ></span>
            </p>
            <button class="link-button" id="setup-grant-mic" type="button" hidden>
              <span data-i18n="grantMicrophoneAccess"></span>
            </button>
          </li>
          <li class="setup-row" id="setup-capture" data-state="pending">
            <span class="setup-icon" id="setup-capture-icon" aria-hidden="true">…</span>
            <p>
              <strong data-i18n="screenCapture"></strong>
              <span
                id="setup-capture-state"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                data-i18n="setupPendingCheckingCapture"
              ></span>
            </p>
            <button class="button" id="enable-capture" type="button" hidden>
              <span data-i18n="enableScreenCapture"></span>
            </button>
          </li>
          <li class="setup-row" id="setup-nano" data-state="pending">
            <span class="setup-icon" id="setup-nano-icon" aria-hidden="true">…</span>
            <p>
              <strong data-i18n="geminiNano"></strong>
              <span
                id="setup-nano-state"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                data-i18n="setupPendingCheckingLocalModel"
              ></span>
            </p>
            <button class="button" id="setup-prepare-nano" type="button" hidden>
              <span data-i18n="prepareGeminiNano"></span>
            </button>
          </li>
          <li class="setup-row" id="setup-premium" data-state="pending">
            <span class="setup-icon" id="setup-premium-icon" aria-hidden="true">…</span>
            <p>
              <strong>
                <span data-i18n="premiumModels"></span>
                <span class="optional-mark" data-i18n="optional"></span>
              </strong>
              <span
                id="setup-premium-state"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                data-i18n="setupPendingCheckingOptionalModels"
              ></span>
            </p>
            <button class="button" id="setup-download-premium" type="button" hidden>
              <span data-i18n="downloadPremiumVoice"></span>
            </button>
          </li>
        </ol>
        <div
          class="setup-complete"
          id="setup-complete"
          role="status"
          aria-live="polite"
          hidden
        >
          <span data-i18n-append="setupComplete">
            <span aria-hidden="true">✓</span>
          </span>
          <button class="link-button" id="dismiss-setup" type="button">
            <span data-i18n="dismiss"></span>
          </button>
        </div>
      </section>

      <section
        class="progress-stack"
        data-i18n-aria-label="modelSetup"
      >
        <div class="progress-card" id="nano-progress-card" hidden>
          <div class="progress-copy"><span id="nano-progress-label" data-i18n="geminiNano"></span><output id="nano-progress-value">0%</output></div>
          <progress
            id="nano-progress"
            max="1"
            value="0"
            aria-labelledby="nano-progress-label"
          ></progress>
        </div>
        <div class="progress-card" id="stt-progress-card" hidden>
          <div class="progress-copy"><span id="stt-progress-label" data-i18n="moonshineSpeechModel"></span><output id="stt-progress-value">0%</output></div>
          <progress
            id="stt-progress"
            max="1"
            value="0"
            aria-labelledby="stt-progress-label"
          ></progress>
        </div>
      </section>

      <section class="premium-voice-card" id="premium-voice-card" data-state="absent">
        <div class="premium-voice-heading">
          <div>
            <p class="section-index" data-i18n="localOutputVoiceIndex"></p>
            <h2 data-i18n="premiumVoice"></h2>
          </div>
          <span class="premium-state" id="premium-voice-state" data-i18n="stateAbsent"></span>
        </div>
        <p
          class="premium-voice-copy"
          id="premium-voice-copy"
          data-i18n="premiumVoiceAbsentCopy"
        ></p>
        <div class="premium-voice-actions">
          <button class="button primary" id="download-premium-voice" type="button">
            <span data-i18n="downloadPremiumVoice"></span>
          </button>
          <label class="voice-switch" for="premium-voice-enabled">
            <span data-i18n="usePremium"></span>
            <input id="premium-voice-enabled" type="checkbox" role="switch" disabled />
            <span class="voice-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <fieldset class="premium-voice-picker" id="premium-voice-picker" hidden>
          <legend data-i18n="chooseVoice"></legend>
          <p data-i18n="previewDownloadsVoice"></p>
          <div class="premium-voice-options" id="premium-voice-options"></div>
        </fieldset>
        <div class="premium-progress" id="premium-progress-card" hidden>
          <div class="progress-copy">
            <span id="premium-progress-label" data-i18n="kokoroVoiceModel"></span>
            <output id="premium-progress-value">0%</output>
          </div>
          <progress
            id="premium-progress"
            max="1"
            value="0"
            aria-labelledby="premium-progress-label"
          ></progress>
        </div>
      </section>

      <section class="premium-voice-card" id="premium-stt-card" data-state="not-downloaded">
        <div class="premium-voice-heading">
          <div>
            <p class="section-index" data-i18n="localInputBetaIndex"></p>
            <h2 data-i18n="highAccuracySpeechBeta"></h2>
          </div>
          <span class="premium-state" id="premium-stt-state" data-i18n="stateChecking"></span>
        </div>
        <p
          class="premium-voice-copy"
          id="premium-stt-copy"
          data-i18n="premiumSpeechCheckingCopy"
        ></p>
        <div class="premium-voice-actions">
          <button class="button primary" id="download-premium-stt" type="button" disabled>
            <span data-i18n="checkingHardwareEllipsis"></span>
          </button>
          <label class="voice-switch" for="premium-stt-enabled">
            <span data-i18n="useHighAccuracy"></span>
            <input id="premium-stt-enabled" type="checkbox" role="switch" disabled />
            <span class="voice-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="premium-progress" id="premium-stt-progress-card" hidden>
          <div class="progress-copy">
            <span id="premium-stt-progress-label" data-i18n="speechModel"></span>
            <output id="premium-stt-progress-value">0%</output>
          </div>
          <progress
            id="premium-stt-progress"
            max="1"
            value="0"
            aria-labelledby="premium-stt-progress-label"
          ></progress>
        </div>
      </section>

      <section class="models-card" aria-labelledby="models-heading">
        <div class="models-heading">
          <div>
            <p class="section-index" data-i18n="localStorageIndex"></p>
            <h2 id="models-heading" data-i18n="models"></h2>
          </div>
          <output id="models-total" aria-live="polite"></output>
        </div>
        <p class="models-copy" data-i18n="modelsCopy"></p>
        <ul class="models-list" id="models-list" aria-live="polite">
          <li class="model-row">
            <span data-i18n="checkingLocalFiles"></span>
          </li>
        </ul>
      </section>

      <section class="settings-card" aria-labelledby="speech-settings-heading">
        <div class="settings-heading">
          <div>
            <p class="section-index" data-i18n="localOutputSettingsIndex"></p>
            <h2 id="speech-settings-heading" data-i18n="speechSettings"></h2>
          </div>
        </div>
        <p
          class="settings-copy"
          id="speech-settings-copy"
          data-i18n="speechSettingsCopy"
        ></p>
        <div class="speech-setting">
          <div class="speech-setting-label">
            <label for="speech-rate" data-i18n="rate"></label>
            <output id="speech-rate-value" for="speech-rate" aria-live="polite">1.0×</output>
          </div>
          <input
            id="speech-rate"
            type="range"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
            aria-describedby="speech-settings-copy"
          />
        </div>
        <div class="speech-setting">
          <div class="speech-setting-label">
            <label for="speech-volume" data-i18n="volume"></label>
            <output id="speech-volume-value" for="speech-volume" aria-live="polite">100%</output>
          </div>
          <input
            id="speech-volume"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="1"
            aria-describedby="speech-settings-copy"
          />
        </div>
        <div class="speech-setting">
          <div class="speech-setting-label">
            <label for="response-verbosity" data-i18n="responseLength"></label>
          </div>
          <select
            id="response-verbosity"
            aria-describedby="speech-settings-copy"
          >
            <option value="normal" data-i18n="responseNormal"></option>
            <option value="brief" data-i18n="responseBrief"></option>
          </select>
        </div>
        <button
          class="button diagnostic-action"
          id="copy-diagnostic-report"
          type="button"
        >
          <span data-i18n="copyDiagnosticReport"></span>
        </button>
        <div class="settings-backup" aria-labelledby="settings-backup-heading">
          <h3 id="settings-backup-heading" data-i18n="settingsBackupHeading"></h3>
          <p data-i18n="settingsBackupCopy"></p>
          <div class="settings-backup-actions">
            <button class="button" id="export-settings-backup" type="button">
              <span data-i18n="exportBackup"></span>
            </button>
            <button class="button" id="choose-settings-backup" type="button">
              <span data-i18n="importBackup"></span>
            </button>
            <input
              id="settings-backup-file"
              type="file"
              accept="application/json,.json"
              hidden
            />
          </div>
          <p
            class="settings-backup-status"
            id="settings-backup-status"
            role="status"
            aria-live="polite"
          ></p>
          <div
            class="settings-backup-confirm"
            id="settings-backup-confirm"
            role="group"
            aria-labelledby="settings-backup-confirm-copy"
            hidden
          >
            <p id="settings-backup-confirm-copy"></p>
            <div class="settings-backup-actions">
              <button
                class="button primary"
                id="confirm-settings-import"
                type="button"
              >
                <span data-i18n="import"></span>
              </button>
              <button
                class="button"
                id="cancel-settings-import"
                type="button"
              >
                <span data-i18n="cancel"></span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="transcript-panel" aria-labelledby="transcript-heading">
        <div class="section-heading">
          <h2 class="section-index" id="transcript-heading" data-i18n="transcriptIndex"></h2>
          <span class="listening-mark" id="listening-mark" data-i18n="stateIdle"></span>
        </div>
        <p
          class="transcript"
          id="transcript"
          aria-live="polite"
          aria-atomic="true"
          data-i18n="transcriptPlaceholder"
        ></p>
      </section>

      <section class="control-panel" data-i18n-aria-label="voiceInput">
        <button
          class="listen-button"
          id="listen-button"
          type="button"
          aria-pressed="false"
          aria-labelledby="listen-label"
        >
          <span class="listen-rings" aria-hidden="true"></span>
          <span id="listen-label" data-i18n="holdToTalk"></span>
          <kbd id="shortcut-label">⌥ S</kbd>
        </button>
        <p class="shortcut-help">
          <span data-i18n="readThisPage"></span>
          <kbd id="read-page-shortcut-label">⌥ R</kbd>
        </p>
        <div
          class="mic-meter"
          id="mic-meter"
          data-state="idle"
          role="meter"
          data-i18n-aria-label="microphoneInputLevel"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span class="mic-meter-fill" id="mic-meter-fill"></span>
        </div>
        <p class="mic-help" id="mic-help">
          <span data-i18n="voiceUnavailable"></span>
          <button class="link-button" id="grant-mic" type="button">
            <span data-i18n="grantMicrophoneAccess"></span>
          </button>
        </p>
      </section>

      <section
        class="dictation-card"
        id="dictation-card"
        aria-labelledby="dictation-heading"
        aria-live="polite"
        hidden
      >
        <div>
          <h2 class="section-index" id="dictation-heading" data-i18n="dictation"></h2>
          <p id="dictation-copy" data-i18n="dictationActiveCopy"></p>
        </div>
        <button
          class="button primary"
          id="resume-dictation"
          type="button"
          hidden
        ><span data-i18n="resume"></span></button>
      </section>

      <form class="command-form" id="command-form">
        <label for="command-input" data-i18n="typeCommand"></label>
        <div class="command-row">
          <input id="command-input" name="command" type="text" autocomplete="off" data-i18n-placeholder="commandPlaceholder" />
          <button type="submit" data-i18n-aria-label="runCommand">→</button>
        </div>
        <p data-i18n="commandPipelineCopy"></p>
      </form>

      <section
        class="clipboard-card"
        id="clipboard-card"
        aria-labelledby="clipboard-heading"
        hidden
      >
        <div>
          <h2 class="section-index" id="clipboard-heading" data-i18n="screenshotReady"></h2>
          <p id="clipboard-copy" data-i18n="copyPngToContinue"></p>
        </div>
        <button class="button primary" id="copy-screenshot" type="button">
          <span data-i18n="copyAndContinue"></span>
        </button>
      </section>

      <section
        class="page-text-card"
        id="page-text-card"
        aria-labelledby="page-text-title"
        hidden
        aria-live="polite"
      >
        <div class="section-heading">
          <h2 class="section-index" id="page-text-title" data-i18n="page"></h2>
          <button class="link-button" id="close-page-text" type="button">
            <span data-i18n="close"></span>
          </button>
        </div>
        <p class="page-text-output" id="page-text-output"></p>
        <div
          class="page-text-output"
          id="reading-text-output"
          role="region"
          data-i18n-aria-label="textBeingRead"
          tabindex="0"
          hidden
        ></div>
        <progress
          id="reading-progress"
          max="1"
          value="0"
          data-i18n-aria-label="readingProgress"
          hidden
        ></progress>
        <div class="reading-controls" id="reading-controls" hidden>
          <button class="button" id="pause-reading" type="button">
            <span data-i18n="pause"></span>
          </button>
          <button class="button" id="skip-reading" type="button">
            <span data-i18n="nextSentence"></span>
          </button>
        </div>
      </section>

      <section
        class="notes-panel"
        id="reminders-panel"
        aria-labelledby="reminders-heading"
      >
        <div class="section-heading">
          <h2 class="section-index" id="reminders-heading">
            <span data-i18n="reminders"></span>
            <span class="storage-count" id="reminders-count" hidden></span>
          </h2>
        </div>
        <ul class="notes-list" id="reminders-list" aria-live="polite">
          <li class="empty-notes" data-i18n="noPendingReminders"></li>
        </ul>
      </section>

      <section class="notes-panel" id="notes-panel" aria-labelledby="notes-heading">
        <div class="section-heading">
          <h2 class="section-index" id="notes-heading">
            <span data-i18n="notesIndex"></span>
            <span class="storage-count" id="notes-count" hidden></span>
          </h2>
          <button class="link-button" id="export-notes" type="button" disabled>
            <span data-i18n="exportMarkdown"></span>
          </button>
        </div>
        <label class="sr-only" for="notes-search" data-i18n="searchNotes"></label>
        <input
          class="notes-search"
          id="notes-search"
          type="search"
          data-i18n-placeholder="searchNotes"
          autocomplete="off"
        />
        <p class="reminder-banner" id="reminder-banner" hidden></p>
        <ul class="notes-list" id="notes-list">
          <li class="empty-notes" data-i18n="noNotesYet"></li>
        </ul>
      </section>

      <section class="log-panel" aria-labelledby="log-heading">
        <div class="section-heading">
          <h2 class="section-index" id="log-heading" data-i18n="logIndex"></h2>
          <button class="link-button" id="clear-log" type="button">
            <span data-i18n="clear"></span>
          </button>
        </div>
        <details class="latency-readout" id="latency-readout" hidden>
          <summary
            id="latency-summary"
            aria-live="polite"
            aria-atomic="true"
          ></summary>
          <table>
            <caption class="sr-only" data-i18n="latencyByStage"></caption>
            <thead>
              <tr>
                <th scope="col" data-i18n="stage"></th>
                <th scope="col" data-i18n="p50"></th>
                <th scope="col" data-i18n="p95"></th>
                <th scope="col" data-i18n="sampleCountAbbreviation"></th>
              </tr>
            </thead>
            <tbody id="latency-details"></tbody>
          </table>
        </details>
        <ol class="action-log" id="action-log">
          <li class="empty-log" data-i18n="noCommandsYet"></li>
        </ol>
        <p
          class="sr-only"
          id="action-log-announcer"
          aria-live="polite"
          aria-atomic="true"
        ></p>
      </section>

      <section class="commands-panel" aria-labelledby="commands-heading">
        <details id="command-reference">
          <summary id="commands-heading">
            <span class="section-index" data-i18n="commandsIndex"></span>
            <span data-i18n="commands"></span>
          </summary>
          <div class="command-reference-list" id="command-reference-list">
            <p class="command-reference-status" data-i18n="loadingCommands"></p>
          </div>
        </details>
      </section>
    </main>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
